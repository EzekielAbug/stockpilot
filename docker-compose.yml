# docker compose config for stockpilot local dev
# docker-compose up -d (run)
# docker-compose down (stop)
# docker-compose logs -f (view logs)
# docker-compose up -d --build


services:
  # 1. PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: stockpilot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockpilot
      POSTGRES_PASSWORD: stockpilot_pass
      POSTGRES_DB: stockpilot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpilot -d stockpilot_db"]
      interval: 10s
      timeout: 5s
      retries: 5
  # 2. Redis Cache & Job Queue
  redis:
    image: redis:7-alpine
    container_name: stockpilot_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  # 3. FastAPI Backend
  api:
    build: .
    container_name: stockpilot_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Override localhost to use the internal docker network names!
      - DATABASE_URL=postgresql+asyncpg://stockpilot:stockpilot_pass@db:5432/stockpilot_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=supersecretkeychangemeinproduction12345
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=7
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  # 4. Celery Background Worker
  worker:
    build: .
    container_name: stockpilot_worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://stockpilot:stockpilot_pass@db:5432/stockpilot_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
volumes: 
  postgres_data:
  redis_data:
